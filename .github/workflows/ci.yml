# Unit, relay end-to-end and browser tests (Chromium, Firefox, WebKit/iPad) on every push.
# `yarn deploy` refuses to ship a commit unless this workflow passed for it.
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false # its auto cache runs Yarn 1 before corepack is enabled
      - run: npm i -g corepack && corepack enable
      - run: yarn install --immutable
      - run: yarn test
      - run: yarn build:relay
      - run: yarn playwright install --with-deps chromium webkit firefox
      - run: xvfb-run --auto-servernum yarn e2e # a virtual display for windowed Firefox (WebGL)
